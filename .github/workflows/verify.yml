name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # scan full history
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  float-math-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify zero float math in domain financial paths
        run: |
          echo "Checking domain money paths for floating point usage..."
          ! git grep -n -E "(\.toDouble\(\)|\.toFloat\(\)|Double\.(valueOf|parseDouble)|Float\.(valueOf|parseFloat))" domain/src/main/kotlin/app/privatemoney/domain/model/Money.kt domain/src/main/kotlin/app/privatemoney/domain/planning/
      - name: Verify zero float math in web financial library
        run: |
          echo "Checking web money paths for floating point usage..."
          ! git grep -n -E "parseFloat" wealthos-web/src/lib/money.ts wealthos-web/src/lib/allocation.ts wealthos-web/src/lib/sipProjection.ts wealthos-web/src/lib/debtPayoff.ts wealthos-web/src/lib/emiSimulator.ts wealthos-web/src/lib/healthRules.ts wealthos-web/src/lib/forensics.ts wealthos-web/src/lib/statementParser.ts wealthos-web/src/types/index.ts

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
      - name: Unit tests (domain, database logic, security logic)
        run: ./gradlew --no-daemon :domain:test :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify APK contains no secrets or debug-only exposure
        run: bash scripts/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk --allow-debug
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: |
            domain/build/reports
            app/build/reports
          retention-days: 14

  web-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wealthos-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wealthos-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run web unit tests
        run: npm test
      - name: TypeScript typecheck and production build
        run: npm run build

